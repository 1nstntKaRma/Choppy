[package]
name = "look-a-d2d"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Look test A: the copy window on Direct2D + DirectWrite (our own small UI layer)"

[[bin]]
name = "choppy-look-a"
path = "src/main.rs"

[dependencies]
look-common = { path = "../common" }
windows-numerics = "0.3"   # Vector2 / Matrix3x2 used by the Direct2D calls
# the official Windows bindings: Direct2D, DirectWrite, WIC, DWM, Win32 windows and input
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
