[package]
name = "look-b-slint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Look test B: the copy window in Slint (femtovg renderer)"
build = "build.rs"

[[bin]]
name = "choppy-look-b"
path = "src/main.rs"

[dependencies]
look-common = { path = "../common" }
# Slint: winit backend + the femtovg (OpenGL) renderer (Skia: its prebuilt library could not be fetched here, see PROGRESS.md);
# winit access for the native title-bar drag
slint = { version = "=1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
# DWM frame touches (dark frame, rounded corners on Windows 11, the shadow) on Slint's window
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "=1.19.1"
