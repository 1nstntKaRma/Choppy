# One exe with the C runtime inside: no VC++ redistributable needed on the user's PC.
# /Brepro: the same source gives the same exe (C#'s Deterministic): no link time stamped in, a hash instead.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/Brepro"]

[build]
target = "x86_64-pc-windows-msvc"
