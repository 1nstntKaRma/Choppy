# Choppy in Rust. See PLAN.md (the steps, rules and file map) and PROGRESS.md (where the work is).
[workspace]
resolver = "3"
members = ["choppy", "look-test/common", "look-test/a-d2d"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"      # catch_unwind at thread boundaries: a job fails safely (a .chpart is never renamed into place)
strip = "symbols"
