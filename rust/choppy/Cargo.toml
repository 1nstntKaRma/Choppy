[package]
name = "choppy"
version = "1.48.0"   # follows VERSION; FileVersion is stamped from VERSION by build.rs
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Choppy - file copy for Windows"
build = "build.rs"

# Every crate here needs a reason (PLAN.md: as few as possible).
[dependencies]
# The official Windows bindings: the Win32 calls of Native.cs (files, volumes, storage and USB queries, the registry,
# text and time). Only the `sys` module calls them.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",                          # CreateFileW / RegCreateKeyExW take SECURITY_ATTRIBUTES
    "Win32_Storage_FileSystem",                # files, find, volumes, drive types, full / long path names
    "Win32_System_IO",                         # DeviceIoControl
    "Win32_Devices_DeviceAndDriverInstallation", # SetupDi* and CM_* (UsbLink: disk -> USB hub port)
    "Win32_System_Registry",                   # HKCU\Software\Choppy
    "Win32_UI_Shell",                          # SHGetKnownFolderPath (LocalApplicationData)
    "Win32_System_Com",                        # CoCreateGuid, CoTaskMemFree
    "Win32_Globalization",                     # CompareStringOrdinal, LCMapStringEx (C#'s OrdinalIgnoreCase, ToUpperInvariant)
    "Win32_System_Diagnostics_Debug",          # FormatMessageW (Win32Exception's message)
    "Win32_System_Environment",                # ExpandEnvironmentStringsW (REG_EXPAND_SZ as .NET reads it)
    "Win32_System_Time",                       # FileTimes.ToLocal
    "Win32_System_Threading",                  # events for overlapped reads, thread priority, processes (the hand-off)
    "Win32_System_Memory",                     # VirtualAlloc: the pipeline's aligned buffers
    "Win32_System_SystemInformation",          # GlobalMemoryStatusEx (buffer and cache budgets), the clock
    "Win32_System_Power",                      # SetThreadExecutionState: the PC doesn't sleep mid-copy
    # step 4: the windows (look test A's own UI layer)
    "Win32_Graphics_Direct2D",                 # drawing
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",              # text
    "Win32_Graphics_Dxgi_Common",              # pixel formats of the render targets
    "Win32_Graphics_Dwm",                      # dark rounded frame and shadow (Native2.Rounded), no white flash
    "Win32_Graphics_Gdi",                      # layered pop-ups, monitors, thumbnails' bitmaps
    "Win32_Graphics_Imaging",                  # WIC: the icon's frames, thumbnails, the test hook's PNG pictures
    "Win32_System_Com_StructuredStorage",      # WIC's PNG encoder (its frame options)
    "Win32_System_DataExchange",               # the clipboard (text boxes)
    "Win32_System_LibraryLoader",              # GetModuleHandle (window classes, the exe's icon)
    "Win32_System_Ole",                        # clipboard formats
    "Win32_UI_Controls",                       # MARGINS (DWM frame)
    "Win32_UI_HiDpi",                          # per-monitor DPI
    "Win32_UI_Input_KeyboardAndMouse",         # keys, capture, mouse leave
    "Win32_UI_WindowsAndMessaging",            # windows, timers, the message loop, icons
    "Win32_UI_Shell_Common",                   # the tray icon, thumbnails, the taskbar button's progress
    "Win32_System_Diagnostics_ToolHelp",       # is another copier running (Takeover.UltracopierInstalled)
    "Win32_NetworkManagement_WNet",            # the Benchmark: the share a network drive letter is mapped to
    # step 5: Explorer and the system
    "Win32_System_Pipes",                      # the pipe a second start hands its command line through
    "Win32_Security_Authorization",            # the pipe's access list (SDDL), the user's SID for the instance names
    "Win32_System_Variant",                    # asking Explorer's windows which folder they show (ShellWindows, IDispatch)
    "Win32_System_Kernel",                     # the crash filter's EXCEPTION_POINTERS (a crash revives the tray Choppy)
] }
# Vector2 / Matrix3x2 in the Direct2D calls (part of the `windows` family, already in the lock file for look test A)
windows-numerics = "0.3"
