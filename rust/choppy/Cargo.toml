[package]
name = "choppy"
version = "1.48.0"   # follows VERSION; FileVersion is stamped from VERSION by build.rs
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Choppy - file copy for Windows"
build = "build.rs"

# Every crate here needs a reason (PLAN.md: as few as possible).
[dependencies]
# The official Windows bindings: the Win32 calls of Native.cs (files, volumes, storage and USB queries, the registry,
# text and time). Only the `sys` module calls them.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",                          # CreateFileW / RegCreateKeyExW take SECURITY_ATTRIBUTES
    "Win32_Storage_FileSystem",                # files, find, volumes, drive types, full / long path names
    "Win32_System_IO",                         # DeviceIoControl
    "Win32_Devices_DeviceAndDriverInstallation", # SetupDi* and CM_* (UsbLink: disk -> USB hub port)
    "Win32_System_Registry",                   # HKCU\Software\Choppy
    "Win32_UI_Shell",                          # SHGetKnownFolderPath (LocalApplicationData)
    "Win32_System_Com",                        # CoCreateGuid, CoTaskMemFree
    "Win32_Globalization",                     # CompareStringOrdinal, LCMapStringEx (C#'s OrdinalIgnoreCase, ToUpperInvariant)
    "Win32_System_Diagnostics_Debug",          # FormatMessageW (Win32Exception's message)
    "Win32_System_Environment",                # ExpandEnvironmentStringsW (REG_EXPAND_SZ as .NET reads it)
    "Win32_System_Time",                       # FileTimes.ToLocal
    "Win32_System_Threading",                  # events for overlapped reads, thread priority, processes (the hand-off)
    "Win32_System_Memory",                     # VirtualAlloc: the pipeline's aligned buffers
    "Win32_System_SystemInformation",          # GlobalMemoryStatusEx (buffer and cache budgets), the clock
    "Win32_System_Power",                      # SetThreadExecutionState: the PC doesn't sleep mid-copy
] }
