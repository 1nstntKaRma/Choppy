# Publishes a release for every push to main that brings a new VERSION (1.25 -> 1.26 = release v1.26 with
# Choppy-v1.26.zip): builds on GitHub's servers (Rust, MSVC) with the self-test, packages the zip with
# SHA256SUMS.txt, records build provenance (gh attestation verify) and creates the release and its tag.
# A push that keeps the version only builds and runs the self-test.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # create the release and its tag
  id-token: write       # build provenance attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.100.0   # the Rust the release was tested with on the user's PC; raise it on purpose

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the tags: is this version released already?

      - name: New version?
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "VERSION=$v" >> $env:GITHUB_ENV
          if (git tag --list "v$v") { "v$v is released already: build and self-test only."; "new=false" >> $env:GITHUB_OUTPUT }
          else { "Releasing v$v."; "new=true" >> $env:GITHUB_OUTPUT }

      - name: Rust (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - name: Build + self-test
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\build.ps1 -Shell Cancel

      - name: Check the version stamp
        shell: powershell
        run: |
          $v = [version]$env:VERSION
          $want = "$($v.Major).$($v.Minor).$([Math]::Max(0, $v.Build)).0"
          $got = (Get-Item bin\Choppy.exe).VersionInfo.FileVersion
          if ($got -ne $want) { throw "bin\Choppy.exe has version $got, VERSION says $want" }

      - name: Check the exe needs only Windows' own DLLs
        shell: pwsh
        run: |
          # +crt-static (rust\.cargo\config.toml): the C runtime is inside the exe, no VC++ redistributable needed
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $dlls = @(& $dumpbin /nologo /dependents bin\Choppy.exe | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' })
          if (-not $dlls) { throw "dumpbin listed no DLLs for bin\Choppy.exe" }
          $dlls
          $crt = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) { throw "bin\Choppy.exe needs the VC++ runtime: $($crt -join ', ')" }

      - name: Package
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          New-Item -ItemType Directory -Force (Join-Path $stage 'bin') | Out-Null
          Copy-Item bin\Choppy.exe (Join-Path $stage 'bin')
          Copy-Item build.ps1, VERSION, README.md, LICENSE, 'Activate Choppy.cmd', 'Revert to Windows Copy.cmd' $stage
          $zip = "Choppy-v$env:VERSION.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, (Join-Path $PWD $zip))
          Copy-Item bin\Choppy.exe .
          $files = $zip, 'Choppy.exe'
          # LF line endings, so `sha256sum -c SHA256SUMS.txt` works everywhere (build.ps1 reads either)
          $lines = $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_" }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4
        if: steps.ver.outputs.new == 'true'
        with:
          subject-path: |
            Choppy-v*.zip
            Choppy.exe

      - name: Publish the release
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          if (Test-Path .github\RELEASE_NOTES.md) { Get-Content .github\RELEASE_NOTES.md -Raw | Set-Content $notes } else { '' | Set-Content $notes }
          $rows = Get-Content SHA256SUMS.txt | ForEach-Object { $h, $n = $_ -split '\s+', 2; "| $n | ``$h`` |" }
          $tail = @('', '### SHA-256 Checksums', '| File | SHA-256 |', '|---|---|') + $rows + @(
            '', 'Built on GitHub Actions from this commit. Verify with:',
            '```', "gh attestation verify Choppy-v$env:VERSION.zip --repo ${{ github.repository }}", '```')
          Add-Content $notes $tail
          gh release create "v$env:VERSION" "Choppy-v$env:VERSION.zip" SHA256SUMS.txt Choppy.exe `
            --target '${{ github.sha }}' --title "Choppy v$env:VERSION" --notes-file $notes
